# Dev container override, layered on ../docker-compose.yaml by devcontainer.json. Only the
# service the dev container attaches to gets the dev target, which adds the locked dev group
# through PYPI_PROXY at build time. Compose defines no other service.
#
# `!override` (Compose 2.24.4 or later) replaces the production mount list instead of merging
# with it, so no ASSETS_DIR or FIREFOX_PROFILE_DIR setting in .env can reach the dev container:
# it gets a throwaway staging volume, its own database volume and no browser profile (DESIGN
# decision C28). The opt-in real-data configuration (real-data/) layers the real share and a
# read-only profile back on top of this file.
# The dev container's Compose project, which overrides the production name in ../docker-compose.yaml
# because the last file's name wins. It is the name the dev container had before the service got its
# own, so its dev_staging, dev_db and dev_persist volumes carry over. Dev Containers CLI 0.60 and later
# reads it from the merged configuration; earlier versions fall back to the first Compose file's
# directory, the repository root, which gives the same name. The real-data configuration layers on
# this file and shares the project.
name: youtube-collector

services:
  app:
    build:
      target: dev
    # Claude Code and Codex state lives on the dev_persist volume, which survives sessions and
    # rebuilds on this machine; only `docker compose down -v` deletes it. The creation hook creates
    # these directories. CLAUDE_CONFIG_DIR also moves ~/.claude.json, so Claude Code's settings,
    # history, memory and sign-in persist; CODEX_HOME does the same for Codex. Nothing here is
    # shared with other machines; only the Git repository is.
    environment:
      CLAUDE_CONFIG_DIR: /home/ubuntu/persist/claude
      CODEX_HOME: /home/ubuntu/persist/codex
    volumes: !override
      - dev_staging:/workspaces/youtube-collector/assets
      - dev_db:/var/lib/youtube-collector
      - dev_persist:/home/ubuntu/persist

volumes:
  dev_staging:
  dev_db:
  dev_persist:
