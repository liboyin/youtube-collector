[build-system]
requires = ["setuptools >= 64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-collector"
version = "0.0.1"
description = "Download YouTube videos, playlists, and captions"
requires-python = ">=3.14"
authors = [
  {name = "Libo Yin", email = "liboyin830@gmail.com"}
]
dependencies = [
  "fastapi",
  "pathlib-extensions@git+https://github.com/liboyin/pathlib-extensions.git",
  "requests",
  "uvicorn[standard]",
  "youtube-transcript-api",
  "yt-dlp[default]",
]

[dependency-groups]
dev = [
  "httpx2",
  "mypy",
  "pytest",
  "pytest-cov",
  "pytest-mock",
  "pytest-randomly",
  "ruff",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
# Missing imports are errors, so a misspelt module or a missing stub fails the gate. Packages that
# ship no type information get a narrow override when the application first imports them; adding
# one earlier makes warn_unused_configs report an unused section on every run. yt_dlp joins this
# list with the change that first imports it.

[[tool.mypy.overrides]]
module = ["pathlib_extensions.*"]  # ".*" also matches the package itself
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=youtube_collector --cov=.agents/skills/adversarial-review/references --cov-report=term-missing --cov-fail-under=80"
# AGENTS.md requires new warnings to be resolved, so any warning fails its test; a test that
# expects one asserts it with pytest.warns, and an accepted tooling warning needs a narrow,
# commented filter here.
filterwarnings = ["error"]
xfail_strict = true

[tool.coverage.run]
branch = true

[tool.setuptools.packages.find]
include = ["youtube_collector*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# pycodestyle, Pyflakes, import order, bugbear, pyupgrade and pydocstyle. The target Python
# comes from requires-python.
select = ["E", "W", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
# AGENTS.md requires Google-style docstrings.
convention = "google"
